version: '3.8'

services:
  drone-postgres:
    image: postgres:15-alpine
    container_name: drone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alphaflight7
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  telemetry-api:
    build: .
    container_name: telemetry-api
    ports:
      - "8000:8000"
    depends_on:
      - drone-postgres