version: '3.8'

services:
  drone-postgres:
    image: postgres:15-alpine
    container_name: drone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alphaflight7
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Cleaned: Deleted folder reference removed completely!
    restart: always

  telemetry-api:
    build: .
    container_name: telemetry-api
    dns:
      - 8.8.8.8 # Forces Docker to bypass local network stalls and find PyPI via Google DNS
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - drone-postgres
      - rabbitmq
    restart: always

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: telemetry_queue
    ports:
      - "5672:5672"          # Protocol port for sending data packets
      - "15672:15672"        # Port for the visual management dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: on-failure

  # --- BACKGROUND WORKER SERVICE (SELF-HEALING) ---
  telemetry-worker:
    build: .
    container_name: telemetry_worker
    command: python worker.py
    dns:
      - 8.8.8.8 # Gives the worker build instance stable internet access too
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DATABASE_URL=postgresql://postgres:alphaflight7@drone-postgres:5432/postgres
    depends_on:
      - rabbitmq
      - drone-postgres
    restart: always

volumes:
  postgres_data: